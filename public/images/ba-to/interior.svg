    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="#5A4034"/>
  <rect width="100%" height="100%" fill="url(#vignette)"/>
  
      <rect x="0" y="0" width="1600" height="1000" fill="#3A2923" opacity="0.3"/>
      <rect x="120" y="200" width="500" height="600" fill="#745345" opacity="0.4"/>
      <rect x="700" y="280" width="700" height="520" fill="#F2E4C8" opacity="0.2"/>
      <ellipse cx="400" cy="700" rx="180" ry="60" fill="#9B9993" opacity="0.35"/>
      <ellipse cx="1000" cy="720" rx="200" ry="70" fill="#9B9993" opacity="0.3"/>
      <rect x="200" y="120" width="300" height="40" fill="#7B8065" opacity="0.4"/>
    
  <rect width="100%" height="100%" filter="url(#grain)" opacity="0.55"/>
  <text x="48" y="952" font-family="Georgia, serif" font-size="28" fill="#F2E4C8" opacity="0.55">Interior</text>
